# ==============================================================================
# CYBERTECH BOX - DEBIAN PRESEED AUTOMATED INSTALLER (ESTILO CISSBOX)
# Instalação 100% autônoma para PC / Mini PC x86_64
# ==============================================================================

# Localização e Idioma
d-i debian-installer/locale string pt_BR.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i keyboard-configuration/layoutcode string br
d-i keyboard-configuration/modelcode string pc105

# Rede (DHCP automático com timeout rápido)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cybertech-box
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# Espelho de Pacotes
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Relógio e Fuso Horário
d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean true

# Particionamento Automático de Disco (Usa o disco inteiro sem perguntar)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Usuário e Senha (usuário cyber com sudo livre)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Cybertech Caixa
d-i passwd/username string cyber
d-i passwd/user-password password cyber
d-i passwd/user-password-again password cyber
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Pacotes do Sistema (Minimal + Kiosk + Hardware Support)
tasksel tasksel/first multiselect
d-i pkgsel/include string xorg openbox nodm chromium cups cups-client nodejs npm curl unclutter x11-xserver-utils alsa-utils pciutils usbutils sudo openssh-server
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Bootloader GRUB automático no MBR/EFI
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# Pós-Instalação: Injeção dos Drivers, Regras Udev e Kiosk
d-i preseed/late_command string \
    in-target usermod -aG sudo,lp,lpadmin,dialout cyber; \
    echo 'cyber ALL=(ALL) NOPASSWD: ALL' > /target/etc/sudoers.d/cyber; \
    chmod 0440 /target/etc/sudoers.d/cyber; \
    echo 'NODM_USER=cyber' > /target/etc/default/nodm; \
    echo 'NODM_ENABLED=true' >> /target/etc/default/nodm; \
    mkdir -p /target/home/cyber/.config/openbox; \
    echo "xset -dpms; xset s off; unclutter -idle 2 & while true; do chromium --kiosk --kiosk-printing --disable-print-preview http://192.168.70.60:3000/pdv; sleep 2; done &" > /target/home/cyber/.config/openbox/autostart; \
    chmod +x /target/home/cyber/.config/openbox/autostart; \
    chown -R 1000:1000 /target/home/cyber/.config

# Finalização e Reinício Automático
d-i finish-install/reboot_in_progress note

